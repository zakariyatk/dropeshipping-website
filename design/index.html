<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dukkan.qa | Online Shopping in Qatar</title>
  <meta name="description" content="Shop electronics, fashion, home, beauty and more in Qatar. Prices in QAR, same-day delivery in Doha, Cash on Delivery.">
  <meta name="theme-color" content="#4c00a4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50: '#f5f0fc', 100: '#ebe0fa', 200: '#d6c2f5', 300: '#b794ee', 400: '#9157e3', 500: '#6d1fd2', 600: '#4c00a4', 700: '#42008f', 800: '#370077', 900: '#2b005e' } },
          fontFamily: { sans: ['Inter', 'IBM Plex Sans Arabic', 'system-ui', 'sans-serif'], arabic: ['IBM Plex Sans Arabic', 'sans-serif'] },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer base {
      html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
      body { @apply bg-white text-zinc-900 antialiased pb-16 lg:pb-0; }
      [dir="rtl"] body { font-family: 'IBM Plex Sans Arabic', Inter, sans-serif; }
      .font-arabic { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    }
    @layer components {
      .container-x { @apply mx-auto w-full max-w-[1400px] px-4 sm:px-6 lg:px-8; }
      .icon-btn { @apply grid h-10 w-10 place-items-center rounded-full text-zinc-700 transition hover:bg-zinc-100 hover:text-zinc-900; }
      .badge { @apply absolute -top-0.5 -end-0.5 grid h-5 min-w-[1.25rem] place-items-center rounded-full bg-brand-600 px-1 text-[10px] font-bold text-white ring-2 ring-white; }
      .btn-primary { @apply inline-flex h-11 items-center justify-center gap-2 rounded-full bg-brand-600 px-6 text-sm font-semibold text-white shadow-lg shadow-brand-600/25 transition hover:bg-brand-700 active:scale-[.98] disabled:cursor-not-allowed disabled:bg-zinc-200 disabled:text-zinc-400 disabled:shadow-none; }
      .btn-dark { @apply inline-flex h-11 items-center justify-center gap-2 rounded-full bg-zinc-900 px-6 text-sm font-semibold text-white transition hover:bg-black active:scale-[.98] disabled:cursor-not-allowed disabled:bg-zinc-200 disabled:text-zinc-400; }
      .btn-outline { @apply inline-flex h-11 items-center justify-center gap-2 rounded-full border border-zinc-200 bg-white px-5 text-sm font-semibold text-zinc-800 transition hover:border-zinc-300 hover:bg-zinc-50 active:scale-[.98]; }
      .input { @apply h-12 w-full rounded-xl border border-zinc-200 bg-white px-4 text-sm outline-none transition placeholder:text-zinc-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15; }
      .input.invalid { @apply border-red-500 ring-4 ring-red-500/10; }
      .label { @apply mb-1.5 block text-xs font-semibold text-zinc-600; }
      .chip { @apply rounded-full bg-zinc-100 px-3 py-1.5 text-xs font-semibold text-zinc-700 transition hover:bg-brand-50 hover:text-brand-700; }
      .nav-link { @apply inline-flex h-9 items-center gap-1.5 rounded-full px-3 font-medium text-zinc-700 transition hover:bg-zinc-100; }
      .filter-title { @apply mb-3 text-sm font-semibold; }
      .status-pill { @apply inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold; }
      .status-pending { @apply bg-zinc-100 text-zinc-700; }
      .status-confirmed { @apply bg-sky-50 text-sky-700; }
      .status-ordered_supplier { @apply bg-brand-50 text-brand-700; }
      .status-shipped { @apply bg-indigo-50 text-indigo-700; }
      .status-out_for_delivery { @apply bg-amber-50 text-amber-700; }
      .status-delivered { @apply bg-emerald-50 text-emerald-700; }
      .status-cancelled, .status-returned { @apply bg-red-50 text-red-600; }
      .wish-btn { @apply text-zinc-700; }
      .wish-btn.wished { @apply text-rose-500; }
      .wish-btn.wished svg { fill: currentColor; }
      .switch { @apply relative h-6 w-11 shrink-0 rounded-full bg-zinc-200 transition; }
      .switch::after { content: ''; @apply absolute top-0.5 start-0.5 h-5 w-5 rounded-full bg-white shadow transition-all; }
      .switch[aria-checked="true"] { @apply bg-brand-600; }
      .switch[aria-checked="true"]::after { inset-inline-start: 1.375rem; }
    }
    .rail { scrollbar-width: none; } .rail::-webkit-scrollbar { display: none; }
    .toast { transition: all .3s ease; animation: toastIn .3s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
    .fade-in { animation: fade .2s ease; } @keyframes fade { from { opacity: 0; } }
    .slide-in { animation: slideEnd .3s cubic-bezier(.2,.8,.2,1); }
    .slide-in-start { animation: slideStart .3s cubic-bezier(.2,.8,.2,1); }
    @keyframes slideEnd { from { transform: translateX(100%); } } [dir="rtl"] .slide-in { animation-name: slideEndRtl; } @keyframes slideEndRtl { from { transform: translateX(-100%); } }
    @keyframes slideStart { from { transform: translateX(-100%); } } [dir="rtl"] .slide-in-start { animation-name: slideStartRtl; } @keyframes slideStartRtl { from { transform: translateX(100%); } }
    .pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); } @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    #main > * { animation: fade .25s ease; }
    @media print { header, footer, nav, .fixed, #toasts, .btn-primary, .btn-outline { display: none !important; } body { padding: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="drawer"></div>
  <div id="modal"></div>
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-20 z-[80] flex flex-col items-center gap-2 px-4 lg:bottom-6"></div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/admin.js"></script>
  <script>
    function openModal(html, w = 'max-w-lg') {
      document.getElementById('modal').innerHTML = `<div class="fixed inset-0 z-[70] grid place-items-center overflow-y-auto bg-black/40 p-4 fade-in" onclick="if(event.target===this)closeModal()">
        <div class="relative my-8 w-full ${w} rounded-3xl bg-white p-6 shadow-2xl pop sm:p-7"><button onclick="closeModal()" class="icon-btn absolute end-3 top-3" aria-label="Close">${icon('x')}</button>${html}</div></div>`;
      lucide.createIcons();
    }
    function closeModal() { document.getElementById('modal').innerHTML = ''; }
    render();
  </script>
</body>
</html>
